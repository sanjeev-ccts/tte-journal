<style>

        --orange: #f97316; --purple: #a855f7; --yellow: #eab308;

    }
    body.dark-mode {
        --bg: #0d1117; --card: #161b22; --text: #e6edf3; --text-muted: #8b949e;
        --border: #30363d; --input-bg: #21262d; --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; padding-bottom: 70px; }
    .top-bar { position: sticky; top: 0; background: var(--top-bar-bg); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .top-bar h1 { margin: 0; font-size: 17px; font-weight: 900; color: #fde047; }
    .back-btn { background: transparent; border: none; color: white; font-size: 14px; cursor: pointer; padding: 4px 8px; }
    .screen-content { padding: 15px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .tab-bar { display: flex; background: var(--card); border-radius: 30px; padding: 4px; margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 10px; text-align: center; border-radius: 30px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
    .tab-btn.active { background: var(--blue); color: white; }
    input, select { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 14px; margin-bottom: 10px; }
    button.action { width: 100%; padding: 12px; border: none; border-radius: 30px; font-weight: 700; font-size: 14px; color: white; background: var(--blue); cursor: pointer; box-shadow: var(--shadow); }
    .hidden { display: none !important; }
    .duty-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 10px; background: var(--input-bg); margin-bottom: 8px; border-left: 4px solid var(--blue); }
    .duty-row.rest { border-left-color: var(--text-muted); opacity: 0.7; }
    .duty-row.lr { border-left-color: var(--purple); }
    .badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; }
    h3.section-title { font-size: 13px; font-weight: 900; color: var(--blue); text-transform: uppercase; margin: 18px 0 8px 0; }
    .loading { text-align: center; padding: 30px; color: var(--text-muted); }
    .train-pill { display: inline-block; background: rgba(59,130,246,0.12); color: var(--blue); padding: 3px 10px; border-radius: 8px; font-weight: 800; font-size: 13px; margin-right: 6px; }    .duty-box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .duty-box { background: var(--input-bg); border-radius: 10px; padding: 10px; border-left: 4px solid var(--blue); }
    .duty-box.rest { border-left-color: var(--text-muted); opacity: 0.75; }
    .duty-box.lr { border-left-color: var(--purple); }
    .duty-box .db-date { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .duty-box .db-content { font-size: 12px; font-weight: 700; }
    .duty-box .db-badge { font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 8px; display: inline-block; margin-top: 4px; }
</style>
</head>

// Get program number for a team on a given date
function getProgramForTeamOnDate(teamNo, dateStr) {
    const team = window.appData.teamMaster[teamNo];
    if (!team) return null;
    const anchor = new Date(window.appData.anchorDate + 'T00:00:00');
    const target = new Date(dateStr + 'T00:00:00');
    const dayDiff = Math.round((target - anchor) / (1000*60*60*24));
    let prog = ((team.baseProg - 1 + dayDiff) % 43 + 43) % 43 + 1;
    return prog;
}

// Find the duty for a team on a specific date

    const progData = window.appData.linkProgramme[prog];
    const d = new Date(dateStr + 'T00:00:00');
    const dow = d.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
    const dayNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const dayPrefix = dayNames[dow];
    
    if (!progData) return { prog, status: 'off', dateStr };
    
    // Each program has AT MOST ONE slot per weekday (either _IN or _OUT, never both).
    // Check both possible slot names and use whichever actually exists in this program's data.
    const outSlot = `${dayPrefix}_OUT`;
    const inSlot = `${dayPrefix}_IN`;
    let matchedSlot = null, train = null;
    
    if (progData[outSlot] !== undefined) {
        matchedSlot = outSlot;
        train = progData[outSlot];
    } else if (progData[inSlot] !== undefined) {
        matchedSlot = inSlot;
        train = progData[inSlot];
    }
    
    if (!matchedSlot) return { prog, status: 'off', dateStr };
    if (train === 'REST') return { prog, status: 'rest', dateStr, slot: matchedSlot };
    if (train === 'LR') return { prog, status: 'lr', dateStr, slot: matchedSlot };
    if (train === 'SPARE') return { prog, status: 'spare', dateStr, slot: matchedSlot };
    
    return { prog, status: 'duty', dateStr, slot: matchedSlot, train, isOut: matchedSlot.endsWith('_OUT') };
}

// ============ FIREBASE LOAD ============
async function loadRosterData() {
    try {
        const snap = await get(ref(db, 'roster/BSB'));
        const data = snap.val();
        if (data && data.teamMaster && data.linkProgramme) {
            window.appData.teamMaster = data.teamMaster;
            window.appData.linkProgramme = data.linkProgramme;
            window.appData.anchorDate = data.anchorDate || DEFAULT_ANCHOR_DATE;
        } else {
            // Seed defaults into Firebase (first time setup)
            window.appData.teamMaster = DEFAULT_TEAM_MASTER;
            window.appData.linkProgramme = DEFAULT_LINK_PROGRAMME;
            window.appData.anchorDate = DEFAULT_ANCHOR_DATE;
            if (window.isAdmin) {
                await set(ref(db, 'roster/BSB'), window.appData);
            }
        }
    } catch(e) {
        console.error('Roster load error', e);
        window.appData.teamMaster = DEFAULT_TEAM_MASTER;
        window.appData.linkProgramme = DEFAULT_LINK_PROGRAMME;
        window.appData.anchorDate = DEFAULT_ANCHOR_DATE;
    }
    populateTeamSelectors();
    renderMyDutyWeek();
}

// Collect a range of "trips" for a team. A trip = one duty block (OUT day + its paired IN day, or single REST/LR/SPARE day).
// direction: 'future' collects forward from today, 'past' collects backward from yesterday.
function collectTrips(teamNo, direction, count) {
    const trips = [];
    const today = new Date();
    today.setHours(0,0,0,0);
    let d = new Date(today);
    if (direction === 'past') d.setDate(d.getDate() - 1);
    
    let seenDates = new Set();
    let iterations = 0;
    const maxIterations = 90; // safety cap
    
    while (trips.length < count && iterations < maxIterations) {
        iterations++;
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if (!seenDates.has(dateStr)) {
            seenDates.add(dateStr);
            const duty = getDutyForTeamOnDate(teamNo, dateStr);
            const dateLabel = d.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short'});
            if (duty && duty.status === 'duty') {
                trips.push({ dateLabel, duty, dateStr });
            } else if (duty && (duty.status === 'rest' || duty.status === 'lr' || duty.status === 'spare')) {
                trips.push({ dateLabel, duty, dateStr });
            }
            // 'off' status (no data for that weekday) is skipped, not counted as a trip
        }
        if (direction === 'future') d.setDate(d.getDate() + 1);
        else d.setDate(d.getDate() - 1);
    }
    
    if (direction === 'past') trips.reverse(); // show chronological order (oldest first among the "last 1")
    return trips;
}

function renderMyDutyWeek() {
    const container = document.getElementById('my-duty-week');
    const teamNo = document.getElementById('my-team-select').value;
    if (!teamNo) { container.innerHTML = ''; return; }
    
    const team = window.appData.teamMaster[teamNo];
    let html = `<div class="card">
        <div style="font-size:13px; font-weight:900; color:var(--text); margin-bottom:4px;">Team ${teamNo}</div>
        <div style="font-size:12px; color:var(--text-muted);">COR: ${team.cor}<br>TTE-1: ${team.tte1}${team.tte2 ? '<br>TTE-2: '+team.tte2 : ''}</div>
    </div>`;
    
    // Suggestion 2: Next 3 trips (up+down counted as one trip)
    const futureTrips = collectTrips(teamNo, 'future', 3);
    html += '<h3 class="section-title">🔜 Next 3 Trips</h3>';
    html += '<div class="duty-box-grid">';
    futureTrips.forEach(t => { html += renderDutyBox(t.dateLabel, t.duty); });
    if (futureTrips.length === 0) html += '<p style="grid-column:1/-1; color:var(--text-muted); font-size:12px; text-align:center;">No upcoming trips found</p>';
    html += '</div>';
    
    // Suggestion 2: Last 1 trip
    const pastTrips = collectTrips(teamNo, 'past', 1);
    html += '<h3 class="section-title">🔙 Last Trip</h3>';
    html += '<div class="duty-box-grid">';
    pastTrips.forEach(t => { html += renderDutyBox(t.dateLabel, t.duty); });
    if (pastTrips.length === 0) html += '<p style="grid-column:1/-1; color:var(--text-muted); font-size:12px; text-align:center;">No recent trip found</p>';
    html += '</div>';
    
    container.innerHTML = html;
}

// Suggestion 3: Compact box renderer (used in My Duty and Search)
function renderDutyBox(dateLabel, duty) {
    if (!duty) return `<div class="duty-box"><div class="db-date">${dateLabel}</div><div class="db-content" style="color:var(--text-muted);">No data</div></div>`;
    
    let cls = 'duty-box', badge = '', content = '';
    if (duty.status === 'rest') {
        cls += ' rest'; badge = '<span class="db-badge" style="background:#94a3b820;color:var(--text-muted);">REST</span>';
        content = `Program ${duty.prog}`;
    } else if (duty.status === 'lr') {
        cls += ' lr'; badge = '<span class="db-badge" style="background:rgba(168,85,247,0.15);color:var(--purple);">LR</span>';
        content = `Prog ${duty.prog} — Leave Reserve`;
    } else if (duty.status === 'spare') {
        badge = '<span class="db-badge" style="background:rgba(234,179,8,0.15);color:var(--yellow);">SPARE</span>';
        content = `Program ${duty.prog}`;
    } else if (duty.status === 'duty') {
        const dirIcon = duty.isOut 
            ? '<span style="color:#16a34a; font-weight:900;">⬆</span>' 
            : '<span style="color:#2563eb; font-weight:900;">⬇</span>';
        const trains = duty.train.split('/');
        if (trains.length === 2) {
            content = `${dirIcon} ${trains[0]}<br><span style="font-size:10px; color:var(--text-muted);">+ ${trains[1]} (TTE-2)</span>`;
        } else {
            content = `${dirIcon} ${trains[0]}`;
        }
        badge = `<span class="db-badge" style="background:rgba(59,130,246,0.15);color:var(--blue);">Prog ${duty.prog}</span>`;
    } else {
        content = 'Off';
    }
    
    return `<div class="${cls}">
        <div class="db-date">${dateLabel}</div>
        <div class="db-content">${content}</div>
        ${badge}
    </div>`;
}

function renderDutyRow(dateLabel, duty, team) {
    if (!duty) return `<div class="duty-row"><span>${dateLabel}</span><span style="color:var(--text-muted);">No data</span></div>`;
    
    let cls = 'duty-row', badge = '', content = '';
    if (duty.status === 'rest') {
        cls += ' rest'; badge = '<span class="badge" style="background:#94a3b820;color:var(--text-muted);">REST</span>';
        content = `Program ${duty.prog}`;
    } else if (duty.status === 'lr') {
        cls += ' lr'; badge = '<span class="badge" style="background:rgba(168,85,247,0.15);color:var(--purple);">LR</span>';
        content = `Program ${duty.prog} — Leave Reserve (check with admin)`;
    } else if (duty.status === 'spare') {
        badge = '<span class="badge" style="background:rgba(234,179,8,0.15);color:var(--yellow);">SPARE</span>';
        content = `Program ${duty.prog} — Spare Duty`;
    } else if (duty.status === 'duty') {
        // Suggestion 1: colored up/down icon based on direction
        const dirIcon = duty.isOut 
            ? '<span style="color:#16a34a; font-weight:900; font-size:15px;">⬆</span>' 
            : '<span style="color:#2563eb; font-weight:900; font-size:15px;">⬇</span>';
        const dirLabel = duty.isOut ? 'Outward' : 'Inward';
        const trains = duty.train.split('/');
        if (trains.length === 2) {
            content = `${dirIcon} <span class="train-pill">${trains[0]}</span> (COR+TTE-1) &nbsp; <span class="train-pill">${trains[1]}</span> (TTE-2)`;
        } else {
            content = `${dirIcon} <span class="train-pill">${trains[0]}</span> <span style="font-size:10px; color:var(--text-muted);">${dirLabel}</span>`;
        }
        badge = `<span class="badge" style="background:rgba(59,130,246,0.15);color:var(--blue);">Prog ${duty.prog}</span>`;
    } else {
        content = 'Off / No duty this day';
    }
    
    return `<div class="${cls}">
        <div style="flex:1;">
            <div style="font-size:12px; font-weight:700; color:var(--text-muted);">${dateLabel}</div>
            <div style="font-size:13px; margin-top:2px;">${content}</div>
        </div>
        ${badge}
    </div>`;
}

    Object.keys(window.appData.teamMaster).sort((a,b)=>a-b).forEach(t => {

window.renderTeamSearch = function() {
    const teamNo = document.getElementById('search-team').value;

window.renderTrainSearch = function() {
    const trainNo = document.getElementById('search-train').value.trim();
    const result = document.getElementById('search-train-result');
    if (!trainNo) { result.innerHTML = ''; return; }
    
    let html = `<h3 class="section-title">Teams running Train ${trainNo} (next 7 days)</h3><div class="duty-box-grid">`;
    let found = false;
    const today = new Date();
    for (let i = 0; i < 7; i++) {
        const d = new Date(today); d.setDate(d.getDate()+i);
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const dateLabel = d.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short'});
        Object.keys(window.appData.teamMaster).forEach(t => {
            const duty = getDutyForTeamOnDate(t, dateStr);
            if (duty && duty.status === 'duty' && duty.train.includes(trainNo)) {
                found = true;
                const team = window.appData.teamMaster[t];
                const dirIcon = duty.isOut ? '<span style="color:#16a34a;">⬆</span>' : '<span style="color:#2563eb;">⬇</span>';
                html += `<div class="duty-box">
                    <div class="db-date">${dateLabel}</div>
                    <div style="font-size:12px; font-weight:900;">${dirIcon} Team ${t}</div>
                    <div style="font-size:10px; color:var(--text-muted);">${team.cor}${team.tte1 ? ', '+team.tte1 : ''}${team.tte2 ? ', '+team.tte2 : ''}</div>
                </div>`;
            }
        });
    }
    html += '</div>';
    if (!found) html = '<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:15px;">No matches in next 7 days</p>';
    result.innerHTML = html;
};
