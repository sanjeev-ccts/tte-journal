<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BSB Duty Roster</title>
<style>
    :root {
        --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --text-muted: #64748b;
        --border: #e2e8f0; --blue: #3b82f6; --green: #22c55e; --red: #ef4444;
        --orange: #f97316; --purple: #a855f7; --yellow: #eab308;
        --top-bar-bg: #0f172a; --input-bg: #f8fafc; --shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    body.dark-mode {
        --bg: #0d1117; --card: #161b22; --text: #e6edf3; --text-muted: #8b949e;
        --border: #30363d; --input-bg: #21262d; --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; padding-bottom: 20px; font-size: 15px; }

    .top-bar { position: sticky; top: 0; background: var(--top-bar-bg); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .top-bar span { font-size: 14px; font-weight: 800; color: #fde047; }
    body.in-iframe .top-bar { display: none; }

    #roster-float-back { display: none; position: fixed; top: 14px; left: 10px; z-index: 500; background: rgba(15,23,42,0.88); color: white; border: none; border-radius: 20px; padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    body.in-iframe #roster-float-back { display: block; }
    body.in-iframe .tab-bar { margin-top: 55px; }

    .screen-content { padding: 15px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .tab-bar { display: flex; background: var(--card); border-radius: 30px; padding: 4px; margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 11px; text-align: center; border-radius: 30px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
    .tab-btn.active { background: var(--blue); color: white; }

    input, select { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 15px; margin-bottom: 10px; }
    button.action { width: 100%; padding: 13px; border: none; border-radius: 30px; font-weight: 700; font-size: 15px; color: white; background: var(--blue); cursor: pointer; box-shadow: var(--shadow); }
    .hidden { display: none !important; }

    h3.section-title { font-size: 14px; font-weight: 900; color: var(--blue); text-transform: uppercase; margin: 18px 0 10px 0; }

    #my-team-select { font-size: 17px; font-weight: 800; padding: 14px; }
    .team-info-card .team-title { font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .team-info-card .team-members { font-size: 15px; color: var(--text-muted); line-height: 1.6; }

    .duty-box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .duty-box { border-radius: 12px; padding: 13px; background: var(--card); border: 1px solid var(--border); }
    .duty-box .db-date { font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; }
    .duty-box .db-up { font-size: 16px; font-weight: 900; color: #15803d; margin-bottom: 3px; }
    .duty-box .db-down { font-size: 16px; font-weight: 900; color: #1d4ed8; }
    .duty-box .db-arr-date { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }
    .duty-box.trip-box { background: rgba(59,130,246,0.10); }
    .duty-box.rest-box { background: rgba(148,163,184,0.15); }
    .duty-box.lr-box { background: rgba(168,85,247,0.12); }
    .duty-box .db-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 8px; display: inline-block; margin-top: 6px; background: rgba(59,130,246,0.15); color: var(--blue); }

    .search-row { display: flex; gap: 8px; }
    .search-row input { flex: 1; margin-bottom: 0; }
    .clear-btn { width: auto; flex-shrink: 0; padding: 0 16px; background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
</style>
</head>

<div id="fatal-error-box" class="hidden" style="position:fixed; top:0; left:0; width:100%; padding:15px; background:#fee2e2; color:#991b1b; font-family:monospace; font-size:12px; z-index:99999; white-space:pre-wrap; word-break:break-all; border-bottom:3px solid #dc2626;"></div>

<script>
window.onerror = function(msg, url, line, col, error) {
    const box = document.getElementById('fatal-error-box');
    if (box) {
        box.classList.remove('hidden');
        box.innerText = '⚠️ ERROR: ' + msg + '\nLine: ' + line + ', Col: ' + col + (error && error.stack ? '\n' + error.stack : '');
    }
    return false;
};
if (window.parent !== window) {
    document.body.classList.add('in-iframe');
}
</script>

<div class="top-bar"><span>📅 BSB Duty Roster</span></div>

<div class="screen-content">

    <div class="tab-bar">
        <div class="tab-btn active" id="tab-mine" onclick="switchTab('mine')">My Duty</div>
        <div class="tab-btn" id="tab-search" onclick="switchTab('search')">Search</div>
        <div class="tab-btn hidden" id="tab-admin" onclick="switchTab('admin')">Admin</div>

    <div id="view-mine">
        <div class="card">
            <label style="font-size:13px; font-weight:700; color:var(--blue);">Your Team Number</label>
            <select id="my-team-select" onchange="onMyTeamChange()">
                <option value="">-- Select your team --</option>
            </select>
            <p style="font-size:12px; color:var(--text-muted); margin:5px 0 0 0;">Don't know your team? Use Search tab and find your name.</p>
        </div>
        <div id="my-duty-week"></div>
    </div>

    <div id="view-search" class="hidden">
        <div class="card">
            <label style="font-size:13px; font-weight:700; color:var(--purple);">Search by Team No</label>
            <div class="search-row">
                <input type="number" id="search-team" placeholder="e.g. 9" oninput="renderTeamSearch()">
                <button class="clear-btn" onclick="window.clearTeamSearch()">Clear</button>
            </div>
        </div>
        <div id="search-team-result"></div>

        <div class="card">
            <label style="font-size:13px; font-weight:700; color:var(--orange);">Search by Train No</label>
            <div class="search-row">
                <input type="text" id="search-train" placeholder="e.g. 15127" oninput="renderTrainSearch()">
                <button class="clear-btn" onclick="window.clearTrainSearch()">Clear</button>
            </div>
        </div>
        <div id="search-train-result"></div>

        <div class="card">
            <label style="font-size:13px; font-weight:700; color:var(--blue);">Search by Date</label>
            <div class="search-row">
                <input type="date" id="search-date" onchange="renderDateSearch()">
                <button class="clear-btn" onclick="window.clearDateSearch()">Clear</button>
            </div>
        </div>
        <div id="search-date-result"></div>
    </div>

    <div id="view-admin" class="hidden">
        <div class="card">
            <h3 style="margin:0 0 10px 0; font-size:15px; color:var(--red);">⚙️ Roster Admin</h3>
            <label style="font-size:13px; font-weight:700;">Rotation Anchor Date</label>
            <input type="date" id="admin-anchor-date">
            <button class="action" style="background:var(--green); margin-top:5px;" onclick="saveAnchorDate()">Save Anchor Date</button>
        </div>

        <div class="card">
            <h3 style="margin:0 0 10px 0; font-size:15px; color:var(--blue);">👥 Edit Team Master</h3>
            <select id="admin-team-select" onchange="loadTeamForEdit()">
                <option value="">-- Select team to edit --</option>
            </select>
            <div id="admin-team-edit-form" class="hidden">
                <label style="font-size:13px;">Base Program No</label>
                <input type="number" id="admin-edit-baseprog">
                <label style="font-size:13px;">COR Name</label>
                <input type="text" id="admin-edit-cor">
                <label style="font-size:13px;">TTE-1 Name</label>
                <input type="text" id="admin-edit-tte1">
                <label style="font-size:13px;">TTE-2 Name</label>
                <input type="text" id="admin-edit-tte2">
                <button class="action" style="background:var(--green);" onclick="saveTeamEdit()">Save Team</button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin:0 0 10px 0; font-size:15px; color:var(--purple);">🚂 Edit Link Programme</h3>
            <select id="admin-prog-select">
                <option value="">-- Select program to edit --</option>
            </select>
            <div id="admin-prog-edit-form" class="hidden" style="margin-top:10px;">
                <div id="admin-prog-slots"></div>
                <button class="action" style="background:var(--green); margin-top:10px;" onclick="saveProgEdit()">Save Program</button>
            </div>
        </div>
    </div>

</div>

// ============ CORE LOGIC (rewritten: OUT-anchored, same-column IN lookup) ============

function getProgramForTeamOnDate(teamNo, dateStr) {
    const team = window.appData.teamMaster[teamNo];
    if (!team) return null;
    const anchor = new Date(window.appData.anchorDate + 'T00:00:00');
    const target = new Date(dateStr + 'T00:00:00');
    const dayDiff = Math.round((target - anchor) / (1000*60*60*24));
    return ((team.baseProg - 1 + dayDiff) % 43 + 43) % 43 + 1;
}

function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function nextProgNo(p) { return (p % 43) + 1; }

// Finds the trip that STARTS on this exact date for this team (i.e. this date has an OUT entry for the team's program).
// Returns null if this date is not an OUT day for the team.
function getTripStartingOn(teamNo, dateStr) {
    const prog = getProgramForTeamOnDate(teamNo, dateStr);
    if (!prog) return null;
    const progData = window.appData.linkProgramme[prog];
    const d = new Date(dateStr + 'T00:00:00');
    const dow = d.getDay();
    const dayNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const dayPrefix = dayNames[dow];
    const outSlot = `${dayPrefix}_OUT`;

    if (!progData || progData[outSlot] === undefined) return null;

    const outVal = progData[outSlot];
    if (outVal === 'REST') return { prog, dateStr, status: 'rest' };
    if (outVal === 'LR') return { prog, dateStr, status: 'lr' };
    if (outVal === 'SPARE') return { prog, dateStr, status: 'spare' };

    // The return (IN) slot is always the SAME single column position (one slot forward in sequence).
    // For a 2-day duty, Program+1 has the entry there. For a 3-day duty, Program+1 has NOTHING at all
    // in that column (it's the skipped intermediate halt day) and Program+2 has the entry there instead.
    const outIdx = SLOT_ORDER.indexOf(outSlot);
    const inSlot = SLOT_ORDER[(outIdx + 1) % SLOT_ORDER.length];
    const prog1 = nextProgNo(prog);
    const prog1Data = window.appData.linkProgramme[prog1];

    let returnTrain = null, returnDate = null, dayCount = 2;

    if (prog1Data && prog1Data[inSlot] !== undefined) {
        returnTrain = prog1Data[inSlot];
        returnDate = addDays(dateStr, 1);
        dayCount = 2;
    } else {
        const prog2 = nextProgNo(prog1);
        const prog2Data = window.appData.linkProgramme[prog2];
        if (prog2Data && prog2Data[inSlot] !== undefined) {
            returnTrain = prog2Data[inSlot];
            returnDate = addDays(dateStr, 2);
            dayCount = 3;
        }
    }

    return { prog, dateStr, status: 'duty', outTrain: outVal, returnTrain, returnDate, dayCount };
}
window.getTripStartingOn = getTripStartingOn;
window.getProgramForTeamOnDate = getProgramForTeamOnDate;

function collectTrips(teamNo, direction, count) {
    const trips = [];
    const today = new Date(); today.setHours(0,0,0,0);
    let d = new Date(today);
    if (direction === 'past') d.setDate(d.getDate() - 1);

    let iterations = 0;
    const maxIterations = 120;

    while (trips.length < count && iterations < maxIterations) {
        iterations++;
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const trip = getTripStartingOn(teamNo, dateStr);
        if (trip) trips.push(trip);
        if (direction === 'future') d.setDate(d.getDate() + 1);
        else d.setDate(d.getDate() - 1);
    }
    if (direction === 'past') trips.reverse();
    return trips;
}
window.collectTrips = collectTrips;

// ============ FIREBASE LOAD ============
async function loadRosterData() {
    try {
        const snap = await get(ref(db, 'roster/BSB'));
        const data = snap.val();
        if (data && data.teamMaster && data.linkProgramme) {
            window.appData.teamMaster = data.teamMaster;
            window.appData.linkProgramme = data.linkProgramme;
            window.appData.anchorDate = data.anchorDate || DEFAULT_ANCHOR_DATE;
        } else {
            window.appData.teamMaster = DEFAULT_TEAM_MASTER;
            window.appData.linkProgramme = DEFAULT_LINK_PROGRAMME;
            window.appData.anchorDate = DEFAULT_ANCHOR_DATE;
            if (window.isAdmin) await set(ref(db, 'roster/BSB'), window.appData);
        }
    } catch(e) {
        window.appData.teamMaster = DEFAULT_TEAM_MASTER;
        window.appData.linkProgramme = DEFAULT_LINK_PROGRAMME;
        window.appData.anchorDate = DEFAULT_ANCHOR_DATE;
    }
    populateTeamSelectors();
    renderMyDutyWeek();
}
window.loadRosterData = loadRosterData;

function populateTeamSelectors() {
    ['my-team-select', 'admin-team-select'].forEach(selId => {
        const sel = document.getElementById(selId);
        if (!sel) return;
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">-- Select team --</option>';
        Object.keys(window.appData.teamMaster).sort((a,b)=>a-b).forEach(t => {
            const team = window.appData.teamMaster[t];
            sel.innerHTML += `<option value="${t}">Team ${t} — ${team.cor}</option>`;
        });
        sel.value = currentVal;
    });
    const progSel = document.getElementById('admin-prog-select');
    if (progSel) {
        progSel.innerHTML = '<option value="">-- Select program --</option>';
        for (let i = 1; i <= 43; i++) progSel.innerHTML += `<option value="${i}">Program ${i}</option>`;
    }
}

// ============ UI: MY DUTY ============
window.onMyTeamChange = function() {
    const team = document.getElementById('my-team-select').value;
    localStorage.setItem('roster_my_team', team);
    renderMyDutyWeek();
};

function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short'});
}

function renderMyDutyWeek() {
    const container = document.getElementById('my-duty-week');
    const teamNo = document.getElementById('my-team-select').value;
    if (!teamNo) { container.innerHTML = ''; return; }

    const team = window.appData.teamMaster[teamNo];
    let html = `<div class="card team-info-card">
        <div class="team-title">Team ${teamNo}</div>
        <div class="team-members">COR: ${team.cor}<br>TTE-1: ${team.tte1}${team.tte2 ? '<br>TTE-2: '+team.tte2 : ''}</div>
    </div>`;

    const futureTrips = collectTrips(teamNo, 'future', 4);
    html += '<h3 class="section-title">🔜 Next 4 Trips</h3><div class="duty-box-grid">';
    futureTrips.forEach(t => { html += renderTripBox(t); });
    if (futureTrips.length === 0) html += '<p style="grid-column:1/-1; color:var(--text-muted); font-size:13px; text-align:center;">No upcoming trips found</p>';
    html += '</div>';

    const pastTrips = collectTrips(teamNo, 'past', 2);
    html += '<h3 class="section-title">🔙 Last 2 Trips</h3><div class="duty-box-grid">';
    pastTrips.forEach(t => { html += renderTripBox(t); });
    if (pastTrips.length === 0) html += '<p style="grid-column:1/-1; color:var(--text-muted); font-size:13px; text-align:center;">No recent trips found</p>';
    html += '</div>';

    container.innerHTML = html;
}

function renderTripBox(trip) {
    if (trip.status === 'rest') {
        return `<div class="duty-box rest-box">
            <div class="db-date">${fmtDateLabel(trip.dateStr)}</div>
            <div class="db-up" style="color:var(--text-muted);">REST</div>
            <div class="db-badge">Prog ${trip.prog}</div>
        </div>`;
    }
    if (trip.status === 'lr') {
        return `<div class="duty-box lr-box">
            <div class="db-date">${fmtDateLabel(trip.dateStr)}</div>
            <div class="db-up" style="color:var(--purple);">LR Duty</div>
            <div class="db-badge" style="background:rgba(168,85,247,0.18); color:var(--purple);">Prog ${trip.prog}</div>
        </div>`;
    }
    if (trip.status === 'spare') {
        return `<div class="duty-box rest-box">
            <div class="db-date">${fmtDateLabel(trip.dateStr)}</div>
            <div class="db-up" style="color:var(--yellow);">SPARE</div>
            <div class="db-badge" style="background:rgba(234,179,8,0.18); color:var(--yellow);">Prog ${trip.prog}</div>
        </div>`;
    }
    const upTrains = (trip.outTrain || '').split('/');
    const upLabel = upTrains.length === 2 ? `⬆ ${upTrains[0]} <span style="font-size:11px;">+${upTrains[1]}</span>` : `⬆ ${trip.outTrain}`;
    let downHtml = '<div class="db-down" style="color:var(--text-muted); font-size:13px;">Return: pending</div>';
    if (trip.returnTrain) {
        const downTrains = trip.returnTrain.split('/');
        const downLabel = downTrains.length === 2 ? `⬇ ${downTrains[0]} <span style="font-size:11px;">+${downTrains[1]}</span>` : `⬇ ${trip.returnTrain}`;
        downHtml = `<div class="db-down">${downLabel}</div><div class="db-arr-date">Arrives HQ: ${fmtDateLabel(trip.returnDate)}</div>`;
    }
    return `<div class="duty-box trip-box">
        <div class="db-date">${fmtDateLabel(trip.dateStr)}</div>
        <div class="db-up">${upLabel}</div>
        ${downHtml}
        <div class="db-badge">Prog ${trip.prog} · ${trip.dayCount||2}-day</div>
    </div>`;
}
window.renderTripBox = renderTripBox;

// ============ SEARCH ============
window.renderDateSearch = function() {
    const dateStr = document.getElementById('search-date').value;
    const result = document.getElementById('search-date-result');
    if (!dateStr) { result.innerHTML = ''; return; }

    let html = `<h3 class="section-title">Teams starting duty — ${dateStr}</h3><div class="duty-box-grid">`;
    let count = 0;
    Object.keys(window.appData.teamMaster).sort((a,b)=>a-b).forEach(t => {
        const trip = getTripStartingOn(t, dateStr);
        if (trip && trip.status === 'duty') {
            count++;
            const team = window.appData.teamMaster[t];
            html += `<div class="duty-box trip-box">
                <div class="db-date">Team ${t} — ${team.cor}</div>
                <div class="db-up">⬆ ${trip.outTrain}</div>
                ${trip.returnTrain ? `<div class="db-down">⬇ ${trip.returnTrain}</div><div class="db-arr-date">Arrives HQ: ${fmtDateLabel(trip.returnDate)}</div>` : ''}
            </div>`;
        }
    });
    html += '</div>';
    if (count === 0) html = `<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:15px;">No teams starting duty this date.</p>`;
    result.innerHTML = html;
};

window.renderTeamSearch = function() {
    const teamNo = document.getElementById('search-team').value;
    const result = document.getElementById('search-team-result');
    if (!teamNo || !window.appData.teamMaster[teamNo]) { result.innerHTML = ''; return; }

    const team = window.appData.teamMaster[teamNo];
    let html = `<div class="card">
        <div style="font-weight:900; font-size:16px; margin-bottom:5px;">Team ${teamNo}</div>
        <div style="font-size:13px; color:var(--text-muted);">COR: ${team.cor}<br>TTE-1: ${team.tte1}${team.tte2 ? '<br>TTE-2: '+team.tte2 : ''}</div>
    </div>`;

    const futureTrips = collectTrips(teamNo, 'future', 4);
    html += '<h3 class="section-title">🔜 Next 4 Trips</h3><div class="duty-box-grid">';
    futureTrips.forEach(t => { html += renderTripBox(t); });
    if (futureTrips.length === 0) html += '<p style="grid-column:1/-1; color:var(--text-muted); font-size:12px; text-align:center;">No upcoming trips</p>';
    html += '</div>';

    result.innerHTML = html;
};

window.renderTrainSearch = function() {
    const trainNo = document.getElementById('search-train').value.trim();
    const result = document.getElementById('search-train-result');
    if (!trainNo) { result.innerHTML = ''; return; }

    let html = `<h3 class="section-title">Teams running Train ${trainNo} (next 10 days)</h3><div class="duty-box-grid">`;
    let found = false;
    const today = new Date();
    for (let i = 0; i < 10; i++) {
        const d = new Date(today); d.setDate(d.getDate()+i);
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        Object.keys(window.appData.teamMaster).forEach(t => {
            const trip = getTripStartingOn(t, dateStr);
            if (trip && trip.status === 'duty') {
                const isUp = trip.outTrain && trip.outTrain.includes(trainNo);
                const isDown = trip.returnTrain && trip.returnTrain.includes(trainNo);
                if (isUp || isDown) {
                    found = true;
                    const team = window.appData.teamMaster[t];
                    html += `<div class="duty-box trip-box">
                        <div class="db-date">${fmtDateLabel(dateStr)} — Team ${t}</div>
                        <div class="db-up" style="color:${isUp?'#15803d':'#1d4ed8'};">${isUp?'⬆':'⬇'} Train ${trainNo}</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${team.cor}${team.tte1?', '+team.tte1:''}${team.tte2?', '+team.tte2:''}</div>
                    </div>`;
                }
            }
        });
    }
    html += '</div>';
    if (!found) html = '<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:15px;">No matches in next 10 days</p>';
    result.innerHTML = html;
};

window.clearDateSearch = function() {
    document.getElementById('search-date').value = '';
    document.getElementById('search-date-result').innerHTML = '';
};
window.clearTeamSearch = function() {
    document.getElementById('search-team').value = '';
    document.getElementById('search-team-result').innerHTML = '';
};
window.clearTrainSearch = function() {
    document.getElementById('search-train').value = '';
    document.getElementById('search-train-result').innerHTML = '';
};

// ============ TABS ============
window.switchTab = function(tab) {
    ['mine','search','admin'].forEach(t => {
        document.getElementById('view-'+t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-'+t).classList.toggle('active', t === tab);
    });
};

// ============ ADMIN FUNCTIONS ============
window.saveAnchorDate = async function() {
    const date = document.getElementById('admin-anchor-date').value;
    if (!date) return alert('Select a date');
    window.appData.anchorDate = date;
    await set(ref(db, 'roster/BSB/anchorDate'), date);
    alert('Anchor date saved: ' + date);
    renderMyDutyWeek();
};

window.loadTeamForEdit = function() {
    const t = document.getElementById('admin-team-select').value;
    const form = document.getElementById('admin-team-edit-form');
    if (!t) { form.classList.add('hidden'); return; }
    const team = window.appData.teamMaster[t];
    document.getElementById('admin-edit-baseprog').value = team.baseProg;
    document.getElementById('admin-edit-cor').value = team.cor;
    document.getElementById('admin-edit-tte1').value = team.tte1;
    document.getElementById('admin-edit-tte2').value = team.tte2 || '';
    form.classList.remove('hidden');
};

window.saveTeamEdit = async function() {
    const t = document.getElementById('admin-team-select').value;
    if (!t) return;
    const updated = {
        baseProg: parseInt(document.getElementById('admin-edit-baseprog').value),
        cor: document.getElementById('admin-edit-cor').value.trim(),
        tte1: document.getElementById('admin-edit-tte1').value.trim(),
        tte2: document.getElementById('admin-edit-tte2').value.trim()
    };
    window.appData.teamMaster[t] = updated;
    await set(ref(db, `roster/BSB/teamMaster/${t}`), updated);
    alert('Team ' + t + ' updated');
    populateTeamSelectors();
};

document.getElementById('admin-prog-select').addEventListener('change', function() {
    const p = this.value;
    const form = document.getElementById('admin-prog-edit-form');
    const slotsDiv = document.getElementById('admin-prog-slots');
    if (!p) { form.classList.add('hidden'); return; }
    const progData = window.appData.linkProgramme[p] || {};
    slotsDiv.innerHTML = SLOT_ORDER.map(slot => `
        <div style="margin-bottom:8px;">
            <label style="font-size:12px; color:var(--text-muted);">${SLOT_LABELS[slot]}</label>
            <input type="text" id="prog-slot-${slot}" value="${progData[slot] || ''}" placeholder="Train no / REST / LR / SPARE / blank">
        </div>
    `).join('');
    form.classList.remove('hidden');
});

window.saveProgEdit = async function() {
    const p = document.getElementById('admin-prog-select').value;
    if (!p) return;
    const newData = {};
    SLOT_ORDER.forEach(slot => {
        const val = document.getElementById('prog-slot-'+slot).value.trim();
        if (val) newData[slot] = val;
    });
    window.appData.linkProgramme[p] = newData;
    await set(ref(db, `roster/BSB/linkProgramme/${p}`), newData);
    alert('Program ' + p + ' updated');
};

// ============ AUTH & INIT (always starts on My Duty tab) ============
function initAfterAuth() {
    if (window.isAdmin) document.getElementById('tab-admin').classList.remove('hidden');
    switchTab('mine');
    const savedTeam = localStorage.getItem('roster_my_team');
    loadRosterData().then(() => {
        if (savedTeam) {
            document.getElementById('my-team-select').value = savedTeam;
            renderMyDutyWeek();
        }
    });
}

onAuthStateChanged(auth, (user) => {
    if (user) {
        window.currentUid = user.uid;
        window.isAdmin = (user.uid === window.ADMIN_UID);
        initAfterAuth();
    }
});

window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'TTE_LOGS_USER') {
        window.currentUid = event.data.uid;
        window.isAdmin = event.data.isAdmin;
        initAfterAuth();
    }
});

if (window.parent !== window) {
    window.parent.postMessage({ type: 'ROSTER_READY' }, '*');
}

document.getElementById('search-date').valueAsDate = new Date();
document.getElementById('admin-anchor-date').value = DEFAULT_ANCHOR_DATE;

</script>
