<style>

    body.dark-mode {
        --bg: #0d1117; --card: #161b22; --text: #e6edf3; --text-muted: #8b949e;
        --border: #30363d; --input-bg: #21262d; --shadow: 0 3px 10px rgba(0,0,0,0.4);

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; padding-bottom: 75px; font-size: 15px; overscroll-behavior-y: contain; }
    .top-bar { position: sticky; top: 0; background: var(--top-bar-bg); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .top-bar span { font-size: 14px; font-weight: 700; color: #fde047; }
    body.in-iframe .top-bar { display: none; }
    body.in-iframe .screen-content { padding-top: 15px; }
    .floating-back { display: none; position: fixed; right: -5px; top: 45%; background: #334155; color: white; padding: 12px 15px 12px 20px; border-radius: 30px 0 0 30px; box-shadow: 0 3px 10px rgba(0,0,0,0.3); z-index: 5000; cursor: grab; border: 2px solid rgba(255,255,255,0.2); border-right: none; font-weight: 700; font-size: 13px; align-items: center; gap: 5px; touch-action: none; }
    .floating-back:active { cursor: grabbing; }
    body.in-iframe .floating-back { display: flex; }
    .screen-content { padding: 15px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .tab-bar { display: flex; background: var(--card); border-radius: 30px; padding: 4px; margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 11px; text-align: center; border-radius: 30px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
    .tab-btn.active { background: var(--blue); color: white; box-shadow: 0 2px 6px rgba(59,130,246,0.4); }
    input, select { width: 100%; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 15px; margin-bottom: 10px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); font-family: 'Roboto', sans-serif; -webkit-appearance: none; appearance: none; }
    input[type="date"] { -webkit-appearance: none; appearance: none; border-radius: 14px; min-height: 44px; }
    select { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 18px; padding-right: 36px; }
    button.action { width: 100%; padding: 13px; border: none; border-radius: 30px; font-weight: 700; font-size: 15px; color: white; background: var(--blue); cursor: pointer; box-shadow: 0 3px 8px rgba(59,130,246,0.35); font-family: 'Roboto', sans-serif; }
    .hidden { display: none !important; }
    h3.section-title { font-size: 14px; font-weight: 900; color: var(--blue); text-transform: uppercase; margin: 18px 0 10px 0; }
    .section-title-box { text-align: center; background: rgba(59,130,246,0.10); border-radius: 30px; padding: 8px 16px; margin: 18px 0 12px 0; font-size: 13px; font-weight: 900; color: var(--blue); text-transform: uppercase; letter-spacing: 0.5px; box-shadow: var(--shadow); }
    .save-team-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .save-team-row input { flex: 1; margin-bottom: 0; }
    .save-team-row button { width: auto; flex-shrink: 0; padding: 0 18px; border-radius: 12px; background: var(--green); color: white; border: none; font-weight: 700; font-size: 13px; box-shadow: 0 3px 8px rgba(34,197,94,0.3); font-family: 'Roboto', sans-serif; }
    .team-select-card { padding: 10px 16px; text-align: center; }
    .team-select-card label { font-size: 12px; font-weight: 700; color: var(--blue); display: block; margin-bottom: 5px; text-align: center; }
    #my-team-select { font-size: 16px; font-weight: 800; padding: 10px; text-align: center; text-align-last: center; }
    .team-info-card { background: rgba(168,85,247,0.08); padding: 16px; }
    .team-info-card .team-title { font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .team-info-card .team-members { font-size: 15px; line-height: 1.7; }
    .team-info-card .cor-name { color: #dc2626; font-weight: 700; }
    .team-info-card .tte-name { color: #15803d; font-weight: 700; }
    .duty-box-grid { display: flex; flex-direction: column; gap: 10px; }
    .duty-box { border-radius: 16px; padding: 15px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); }
    .duty-box .db-date { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .duty-box .db-up { font-size: 17px; font-weight: 900; color: #15803d; margin-bottom: 4px; }
    .duty-box .db-down { font-size: 17px; font-weight: 900; color: #1d4ed8; }
    .duty-box .db-arr-date { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }
    .duty-box .db-dep-date { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 2px; }
    .duty-box.trip-next { background: rgba(59,130,246,0.30); }
    .duty-box.trip-prev { background: rgba(234,179,8,0.30); }
    .duty-box.rest-box { background: rgba(34,197,94,0.30); }
    .duty-box.rest-box .db-up { color: #15803d; font-weight: 900; }
    .duty-box.lr-box { background: rgba(168,85,247,0.25); }
    .duty-box .db-badge { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 10px; display: inline-block; margin-top: 8px; background: rgba(59,130,246,0.18); color: var(--blue); }
    .search-card { border-radius: 16px; }
    .search-card label { display: block; text-align: center; font-size: 13px; font-weight: 800; margin-bottom: 8px; padding: 6px 12px; border-radius: 20px; }
    .search-row { display: flex; gap: 8px; }
    .search-row input, .search-row select { flex: 1; margin-bottom: 0; }
    .clear-btn { width: auto; flex-shrink: 0; padding: 0 18px; background: rgba(239,68,68,0.5); color: white; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Roboto', sans-serif; }
    .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; height: 55px; background: var(--top-bar-bg); display: flex; justify-content: space-around; align-items: center; z-index: 4000; box-shadow: 0 -4px 15px rgba(0,0,0,0.6); border-top: 1px solid var(--border); padding: 0 15px; }
    .bottom-icon { width: 34px; height: 34px; border-radius: 50%; background: transparent; border: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; font-size: 16px; color: white; cursor: pointer; position: relative; flex-shrink: 0; }

    #save-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #16a34a; color: white; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 9000; transition: transform 0.3s ease; }

<div id="fatal-error-box" class="hidden" style="position:fixed; top:0; left:0; width:100%; padding:15px; background:#fee2e2; color:#991b1b; font-family:monospace; font-size:12px; z-index:99999; white-space:pre-wrap; word-break:break-all; border-bottom:3px solid #dc2626;"></div>
<script>
window.onerror = function(msg, url, line, col, error) {
    const box = document.getElementById('fatal-error-box');
    if (box) {
        box.classList.remove('hidden');
        box.innerText = '⚠️ ERROR: ' + msg + '\nLine: ' + line + ', Col: ' + col + (error && error.stack ? '\n' + error.stack : '');
    }
    return false;
};
if (window.parent !== window) {
    document.body.classList.add('in-iframe');
}
</script>

<div class="top-bar"><span>📅 BSB Duty Roster</span></div>

    <div id="view-search" class="hidden">

function getProgramForTeamOnDate(teamNo, dateStr) {
    const team = window.appData.teamMaster[teamNo];
    if (!team) return null;
    const anchor = new Date(window.appData.anchorDate + 'T00:00:00');
    const target = new Date(dateStr + 'T00:00:00');
    const dayDiff = Math.round((target - anchor) / (1000*60*60*24));
    return ((team.baseProg - 1 + dayDiff) % 43 + 43) % 43 + 1;
}

function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nextProgNo(p) { return (p % 43) + 1; }

function getTripStartingOn(teamNo, dateStr) {
    const prog = getProgramForTeamOnDate(teamNo, dateStr);
    if (!prog) return null;
    const progData = window.appData.linkProgramme[prog];
    const d = new Date(dateStr + 'T00:00:00');
    const dow = d.getDay();
    const dayNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const dayPrefix = dayNames[dow];
    const outSlot = `${dayPrefix}_OUT`;

    if (!progData || progData[outSlot] === undefined) return null;

    const outVal = progData[outSlot];
    if (outVal === 'REST') return { prog, dateStr, status: 'rest' };
    if (outVal === 'LR') return { prog, dateStr, status: 'lr' };
    if (outVal === 'SPARE') return { prog, dateStr, status: 'spare' };

    const outIdx = SLOT_ORDER.indexOf(outSlot);
    const inSlot = SLOT_ORDER[(outIdx + 1) % SLOT_ORDER.length];
    const prog1 = nextProgNo(prog);
    const prog1Data = window.appData.linkProgramme[prog1];

    let returnTrain = null, returnDate = null, dayCount = 2;

    if (prog1Data && prog1Data[inSlot] !== undefined) {
        returnTrain = prog1Data[inSlot];
        returnDate = addDays(dateStr, 1);
        dayCount = 2;
    } else {
        const prog2 = nextProgNo(prog1);
        const prog2Data = window.appData.linkProgramme[prog2];
        if (prog2Data && prog2Data[inSlot] !== undefined) {
            returnTrain = prog2Data[inSlot];
            returnDate = addDays(dateStr, 2);
            dayCount = 3;
        }
    }
    return { prog, dateStr, status: 'duty', outTrain: outVal, returnTrain, returnDate, dayCount };
}
window.getTripStartingOn = getTripStartingOn;
window.getProgramForTeamOnDate = getProgramForTeamOnDate;

function getDutyStatusOnDate(teamNo, dateStr) {
    const trip = getTripStartingOn(teamNo, dateStr);
    if (trip) return { type: 'out', trip };

    for (let back = 1; back <= 2; back++) {
        const startDate = addDays(dateStr, -back);
        const t = getTripStartingOn(teamNo, startDate);
        if (t && t.status === 'duty' && t.returnDate === dateStr) {
            return { type: 'in', trip: t };
        }
        if (t && t.status === 'duty' && t.dayCount === 3 && back === 1 && addDays(startDate,1) === dateStr) {
            return { type: 'halt', trip: t };
        }
    }
    const prog = getProgramForTeamOnDate(teamNo, dateStr);
    const progData = window.appData.linkProgramme[prog];
    if (progData) {
        const d = new Date(dateStr + 'T00:00:00');
        const dayNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
        const dayPrefix = dayNames[d.getDay()];
        const val = progData[`${dayPrefix}_OUT`] || progData[`${dayPrefix}_IN`];
        if (val === 'REST') return { type: 'rest', prog };
        if (val === 'LR') return { type: 'lr', prog };
    }
    return { type: 'none', prog };
}
window.getDutyStatusOnDate = getDutyStatusOnDate;

function collectTrips(teamNo, direction, count) {
    const trips = [];
    const today = new Date(); today.setHours(0,0,0,0);
    let d = new Date(today);
    if (direction === 'past') d.setDate(d.getDate() - 1);
    let iterations = 0;
    while (trips.length < count && iterations < 120) {
        iterations++;
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const trip = getTripStartingOn(teamNo, dateStr);
        if (trip) trips.push(trip);
        if (direction === 'future') d.setDate(d.getDate() + 1);
        else d.setDate(d.getDate() - 1);
    }
    if (direction === 'past') trips.reverse();
    return trips;
}
window.collectTrips = collectTrips;

async function loadRosterData() {
    try {
        const snap = await get(ref(db, 'roster/BSB'));
        const data = snap.val();
        if (data && data.teamMaster && data.linkProgramme) {
            window.appData.teamMaster = data.teamMaster;
            window.appData.linkProgramme = data.linkProgramme;
            window.appData.anchorDate = data.anchorDate || DEFAULT_ANCHOR_DATE;
        } else {
            window.appData.teamMaster = DEFAULT_TEAM_MASTER;
            window.appData.linkProgramme = DEFAULT_LINK_PROGRAMME;
            window.appData.anchorDate = DEFAULT_ANCHOR_DATE;
            if (window.isAdmin) await set(ref(db, 'roster/BSB'), window.appData);
        }
    } catch(e) {
        window.appData.teamMaster = DEFAULT_TEAM_MASTER;
        window.appData.linkProgramme = DEFAULT_LINK_PROGRAMME;
        window.appData.anchorDate = DEFAULT_ANCHOR_DATE;
    }
    populateTeamSelectors();
    renderMyDutyWeek();
}
window.loadRosterData = loadRosterData;

function populateTeamSelectors() {
    ['my-team-select', 'admin-team-select'].forEach(selId => {
        const sel = document.getElementById(selId);
        if (!sel) return;
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">-- Select team --</option>';
        Object.keys(window.appData.teamMaster).sort((a,b)=>a-b).forEach(t => {
            const team = window.appData.teamMaster[t];
            sel.innerHTML += `<option value="${t}">Team ${t} — ${team.cor}</option>`;
        });
        sel.value = currentVal;
    });
    const progSel = document.getElementById('admin-prog-select');
    if (progSel) {
        progSel.innerHTML = '<option value="">-- Select program --</option>';
        for (let i = 1; i <= 43; i++) progSel.innerHTML += `<option value="${i}">Program ${i}</option>`;
    }
}

function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return `${String(d.getDate()).padStart(2,'0')}-${months[d.getMonth()]} (${days[d.getDay()]})`;
}

function renderMyDutyWeek() {
    const container = document.getElementById('my-duty-week');
    const teamNo = document.getElementById('my-team-select').value;
    if (!teamNo) { container.innerHTML = ''; return; }

    const team = window.appData.teamMaster[teamNo];
    let html = `<div class="card team-info-card">
        <div class="team-title">Team ${teamNo}</div>
        <div class="team-members">
            <span class="cor-name">COR: ${team.cor}</span><br>
            <span class="tte-name">TTE-1: ${team.tte1}</span>${team.tte2 ? `<br><span class="tte-name">TTE-2: ${team.tte2}</span>` : ''}
        </div>
    </div>`;

    const futureTrips = collectTrips(teamNo, 'future', 4);
    html += '<div class="section-title-box">Next Four Trips</div><div class="duty-box-grid">';
    futureTrips.forEach(t => { html += renderTripBox(t, 'next'); });
    if (futureTrips.length === 0) html += '<p style="color:var(--text-muted); font-size:13px; text-align:center;">No upcoming trips found</p>';
    html += '</div>';

    const pastTrips = collectTrips(teamNo, 'past', 2);
    html += '<div class="section-title-box">Last Two Trips</div><div class="duty-box-grid">';
    pastTrips.forEach(t => { html += renderTripBox(t, 'prev'); });
    if (pastTrips.length === 0) html += '<p style="color:var(--text-muted); font-size:13px; text-align:center;">No recent trips found</p>';
    html += '</div>';

    container.innerHTML = html;
}

function renderTripBox(trip, kind) {
    const boxClass = kind === 'next' ? 'trip-next' : 'trip-prev';
    if (trip.status === 'rest') {
        return `<div class="duty-box rest-box">
            <div class="db-date">${fmtDateLabel(trip.dateStr)}</div>
            <div class="db-up">REST</div>
            <div class="db-badge">Prog ${trip.prog}</div>
        </div>`;
    }
    if (trip.status === 'lr') {
        return `<div class="duty-box lr-box">
            <div class="db-date">${fmtDateLabel(trip.dateStr)}</div>
            <div class="db-up" style="color:var(--purple);">LR Duty</div>
            <div class="db-badge" style="background:rgba(168,85,247,0.18); color:var(--purple);">Prog ${trip.prog}</div>
        </div>`;
    }
    if (trip.status === 'spare') {
        return `<div class="duty-box ${boxClass}">
            <div class="db-date">${fmtDateLabel(trip.dateStr)}</div>
            <div class="db-up" style="color:var(--yellow);">SPARE</div>
            <div class="db-badge" style="background:rgba(234,179,8,0.18); color:var(--yellow);">Prog ${trip.prog}</div>
        </div>`;
    }
    const upTrains = (trip.outTrain || '').split('/');
    const upLabel = upTrains.length === 2 ? `⬆ ${upTrains[0]} <span style="font-size:12px;">+${upTrains[1]}</span>` : `⬆ ${trip.outTrain}`;
    let downHtml = '<div class="db-down" style="color:var(--text-muted); font-size:14px;">Return: pending</div>';
    if (trip.returnTrain) {
        const downTrains = trip.returnTrain.split('/');
        const downLabel = downTrains.length === 2 ? `⬇ ${downTrains[0]} <span style="font-size:12px;">+${downTrains[1]}</span>` : `⬇ ${trip.returnTrain}`;
        downHtml = `<div class="db-down">${downLabel}</div><div class="db-arr-date">Arrival Date: ${fmtDateLabel(trip.returnDate)}</div>`;
    }
    return `<div class="duty-box ${boxClass}">
        <div class="db-date">Departure Date: ${fmtDateLabel(trip.dateStr)}</div>
        <div class="db-up">${upLabel}</div>
        ${downHtml}
        <div class="db-badge">Prog ${trip.prog} · ${trip.dayCount||2}-day</div>
    </div>`;
}
window.renderTripBox = renderTripBox;

window.renderTeamSearch = function() {
    const teamNo = document.getElementById('search-team').value;
    const dateStr = document.getElementById('search-team-date').value;
    const result = document.getElementById('search-team-result');

    if (!teamNo || !window.appData.teamMaster[teamNo]) {

        <div style="font-weight:900; font-size:16px; margin-bottom:5px;">Team ${teamNo} — ${fmtDateLabel(dateStr)}</div>

    </div><div class="duty-box-grid">`;

        html += `<div class="duty-box trip-next">

            <div class="db-up" style="color:var(--purple);">Away from HQ (no train)</div>

        html += `<div class="duty-box rest-box"><div class="db-up">REST</div><div class="db-badge">Prog ${status.prog}</div></div>`;
    } else if (status.type === 'lr') {

            });
        }
    }
    html += '</div>';
    if (!found) html = '<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:15px;">No matches found.</p>';
    result.innerHTML = html;
};

window.clearTrainSearch = function() {

window.renderDateOnlySearch = function() {
    const dateStr = document.getElementById('search-date-only').value;
    const result = document.getElementById('search-date-only-result');
    if (!dateStr) return showToast('❌ Select a date', true);

    let html = `<div class="section-title-box">All Teams — ${fmtDateLabel(dateStr)}</div><div class="duty-box-grid">`;
    let count = 0;
    Object.keys(window.appData.teamMaster).sort((a,b)=>a-b).forEach(t => {
        const status = getDutyStatusOnDate(t, dateStr);
        const team = window.appData.teamMaster[t];
        if (status.type === 'out') {
            count++;
            html += `<div class="duty-box trip-next">
                <div class="db-date">Team ${t} — ${team.cor}</div>
                <div class="db-up">⬆ ${status.trip.outTrain}</div>
                ${status.trip.returnTrain ? `<div class="db-down">⬇ ${status.trip.returnTrain}</div><div class="db-arr-date">Arrives HQ: ${fmtDateLabel(status.trip.returnDate)}</div>` : ''}
                <div class="db-badge">Prog ${status.trip.prog} · ${status.trip.dayCount||2}-day</div>
            </div>`;
        } else if (status.type === 'in') {
            count++;
            html += `<div class="duty-box trip-next">
                <div class="db-date">Team ${t} — ${team.cor}</div>
                <div class="db-down">⬇ ${status.trip.returnTrain} (Return Day)</div>
                <div class="db-badge">Prog ${status.trip.prog}</div>
            </div>`;
        } else if (status.type === 'halt') {
            count++;
            html += `<div class="duty-box lr-box">
                <div class="db-date">Team ${t} — ${team.cor}</div>
                <div class="db-up" style="color:var(--purple);">Away from HQ (halt day)</div>
                <div class="db-badge" style="background:rgba(168,85,247,0.18); color:var(--purple);">Prog ${status.trip.prog}</div>
            </div>`;
        } else if (status.type === 'rest') {
            count++;
            html += `<div class="duty-box rest-box"><div class="db-date">Team ${t} — ${team.cor}</div><div class="db-up">REST</div><div class="db-badge">Prog ${status.prog}</div></div>`;
        } else if (status.type === 'lr') {
            count++;
            html += `<div class="duty-box lr-box"><div class="db-date">Team ${t} — ${team.cor}</div><div class="db-up" style="color:var(--purple);">LR Duty</div><div class="db-badge" style="background:rgba(168,85,247,0.18); color:var(--purple);">Prog ${status.prog}</div></div>`;
        }
    });
    html += '</div>';
    if (count === 0) html = `<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:15px;">No duty data for this date.</p>`;
    result.innerHTML = html;
};

window.clearDateOnlySearch = function() {

const TAB_ORDER = ['mine', 'search', 'admin'];
window.switchTab = function(tab) {
    if (tab === 'admin' && !window.isAdmin) return;
    TAB_ORDER.forEach(t => {
        const view = document.getElementById('view-'+t);
        const btn = document.getElementById('tab-'+t);
        if (view) view.classList.toggle('hidden', t !== tab);
        if (btn) btn.classList.toggle('active', t === tab);
    });
    window._currentTab = tab;
};

(function setupSwipe() {
    let startX = 0, startY = 0;
    document.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            const availableTabs = window.isAdmin ? TAB_ORDER : ['mine','search'];
            const curIdx = availableTabs.indexOf(window._currentTab || 'mine');
            if (dx < 0 && curIdx < availableTabs.length - 1) switchTab(availableTabs[curIdx+1]);
            else if (dx > 0 && curIdx > 0) switchTab(availableTabs[curIdx-1]);
        }
    }, { passive: true });
})();

(function setupFloatingBack() {
    const btn = document.getElementById('roster-float-back');
    if (!btn) return;
    let isDragging = false, startY = 0, startTop = 0;

    btn.addEventListener('touchstart', (e) => {
        isDragging = false;
        startY = e.touches[0].clientY;
        startTop = btn.getBoundingClientRect().top;
        e.stopPropagation();
    }, { passive: true });

    btn.addEventListener('touchmove', (e) => {
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dy) > 8) isDragging = true;
        if (isDragging) {
            let newTop = startTop + dy;
            const maxTop = window.innerHeight - btn.offsetHeight - 10;
            newTop = Math.max(10, Math.min(maxTop, newTop));
            btn.style.top = newTop + 'px';
            e.preventDefault();
        }
    }, { passive: false });

    btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (!isDragging) {
            window.parent.postMessage({ type: 'ROSTER_CLOSE' }, '*');
        }
        isDragging = false;
    }, { passive: false });

    btn.addEventListener('click', () => {
        window.parent.postMessage({ type: 'ROSTER_CLOSE' }, '*');
    });
})();

window.loadTeamForEdit = function() {
    const t = document.getElementById('admin-team-select').value;
    const form = document.getElementById('admin-team-edit-form');
    if (!t) { form.classList.add('hidden'); return; }
    const team = window.appData.teamMaster[t];

window.saveTeamEdit = async function() {
    const t = document.getElementById('admin-team-select').value;
    if (!t) return;
    const updated = {
        baseProg: parseInt(document.getElementById('admin-edit-baseprog').value),
        cor: document.getElementById('admin-edit-cor').value.trim(),
        tte1: document.getElementById('admin-edit-tte1').value.trim(),
        tte2: document.getElementById('admin-edit-tte2').value.trim()
    };
    window.appData.teamMaster[t] = updated;
    await set(ref(db, `roster/BSB/teamMaster/${t}`), updated);
    showToast('✅ Team ' + t + ' updated successfully!');
    populateTeamSelectors();
};

document.getElementById('admin-prog-select').addEventListener('change', function() {
    const p = this.value;
    const form = document.getElementById('admin-prog-edit-form');
    const slotsDiv = document.getElementById('admin-prog-slots');
    if (!p) { form.classList.add('hidden'); return; }
    const progData = window.appData.linkProgramme[p] || {};
    slotsDiv.innerHTML = SLOT_ORDER.map(slot => `
        <div style="margin-bottom:8px;">
            <label style="font-size:12px; color:var(--text-muted);">${SLOT_LABELS[slot]}</label>
            <input type="text" id="prog-slot-${slot}" value="${progData[slot] || ''}" placeholder="Train no / REST / LR / SPARE / blank">
        </div>
    `).join('');
    form.classList.remove('hidden');
});

window.saveProgEdit = async function() {
    const p = document.getElementById('admin-prog-select').value;
    if (!p) return;
    const newData = {};
    SLOT_ORDER.forEach(slot => {
        const val = document.getElementById('prog-slot-'+slot).value.trim();
        if (val) newData[slot] = val;
    });
    window.appData.linkProgramme[p] = newData;
    await set(ref(db, `roster/BSB/linkProgramme/${p}`), newData);
    showToast('✅ Program ' + p + ' updated successfully!');
};

    btn.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';

window.submitFeedback = async function() {
    const name = document.getElementById('fb-name').value.trim();
    const oldTeam = document.getElementById('fb-old-team').value.trim();
    const newTeam = document.getElementById('fb-new-team').value.trim();
    const msg = document.getElementById('fb-message').value.trim();
    if (!name || !oldTeam || !msg) return showToast('❌ Name, current team, and message are required', true);

    const entry = { name, oldTeam, newTeam: newTeam || 'Not specified', message: msg, ts: Date.now(), date: new Date().toLocaleDateString() };
    try {
        await set(ref(db, `roster_feedback/${Date.now()}`), entry);
        showToast('✅ Request submitted to admin!');
        document.getElementById('feedback-modal-overlay').classList.add('hidden');
        document.getElementById('fb-name').value = '';
        document.getElementById('fb-old-team').value = '';
        document.getElementById('fb-new-team').value = '';
        document.getElementById('fb-message').value = '';
    } catch(e) {
        showToast('❌ Failed to submit. Try again.', true);
    }
};

function initAfterAuth() {
    if (window.isAdmin) document.getElementById('tab-admin').classList.remove('hidden');
    switchTab('mine');
    if (localStorage.getItem('roster_dark_mode') === '1') {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-toggle').innerText = '☀️';
    }
    const savedTeam = localStorage.getItem('roster_my_team');
    loadRosterData().then(() => {
        if (savedTeam) {
            document.getElementById('my-team-select').value = savedTeam;
            renderMyDutyWeek();
        }
    });
}

onAuthStateChanged(auth, (user) => {
    if (user) {
        window.currentUid = user.uid;
        window.isAdmin = (user.uid === window.ADMIN_UID);
        initAfterAuth();
    }
});

window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'TTE_LOGS_USER') {
        window.currentUid = event.data.uid;
        window.isAdmin = event.data.isAdmin;
        initAfterAuth();
    }
});

if (window.parent !== window) {
    window.parent.postMessage({ type: 'ROSTER_READY' }, '*');
}

document.getElementById('admin-anchor-date').value = DEFAULT_ANCHOR_DATE;

</script>
